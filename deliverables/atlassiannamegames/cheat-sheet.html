<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Atlassian Renamings Cheat Sheet</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1b19;color:#eee;font:16px/1.5 system-ui,sans-serif;text-align:center}a{color:#f7d34a}</style>
<script data-goatcounter="https://didact.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<p>Opening the cheat sheet&hellip;<br><a id="pdf" href="Atlassian-Renamings-Cheat-Sheet-by-Ingo-Jurz.pdf">Tap here if nothing happens</a></p>
<script>
// Counts the visit (GoatCounter reads utm_source from the URL as the referrer), then opens the PDF.
// A PDF cannot run a counting script itself, so the shared link points here.
// The redirect waits until the count request has finished (2.5 s at most), otherwise it could be cancelled.
var go=function(){location.replace(document.getElementById("pdf").href)},t0=Date.now();
(function wait(){
  var sent=performance.getEntriesByType("resource").some(function(e){return e.name.indexOf("goatcounter.com/count")>-1});
  if(sent||Date.now()-t0>2500)setTimeout(go,sent?150:0);else setTimeout(wait,100);
})();
</script>
</body>
</html>
